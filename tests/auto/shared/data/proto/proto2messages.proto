syntax = "proto2";

package qtprotobufnamespace.proto2.tests;

message RequiredMessage {
    required sint32 testFieldInt = 1;
    required bool testFieldBool = 2;
    required string testFieldString = 3;
}

message NestedRequiredMessage {
    required RequiredMessage nested = 1;
}

message RequiredCycle {
    required RequiredCycle next = 1;
}
